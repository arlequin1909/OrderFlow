# `docker compose up --build` levanta el sistema completo sin pasos manuales:
# Postgres + RabbitMQ -> (esperan a estar healthy) -> OrdersApi + InventoryWorker (aplican
# migraciones y cargan el seed de stock automáticamente al arrancar) -> frontend (nginx
# sirviendo el build de producción de la SPA). Ver README.md para el detalle.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orderflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d ${POSTGRES_DB:-orderflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-orderflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-orderflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # UI: http://localhost:15672
    volumes:
      - orderflow_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ordersapi:
    build:
      context: ./backend
      dockerfile: src/OrdersApi/Dockerfile
    container_name: orderflow-ordersapi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Points at the "postgres"/"rabbitmq" service names — resolved via Docker's internal
      # network, not localhost (this container is not the same network namespace as those).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderflow};Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-orderflow}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-orderflow}
      RabbitMq__VirtualHost: /
      # The browser (not this container) calls OrdersApi directly, from the frontend's origin.
      Cors__AllowedOrigins: "http://localhost:${FRONTEND_PORT:-5173}"
    ports:
      - "${ORDERS_API_PORT:-5081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventoryworker:
    build:
      context: ./backend
      dockerfile: src/InventoryWorker/Dockerfile
    container_name: orderflow-inventoryworker
    restart: unless-stopped
    environment:
      # InventoryWorker is a plain generic host (Host.CreateApplicationBuilder), not
      # WebApplication — it reads DOTNET_ENVIRONMENT, not ASPNETCORE_ENVIRONMENT (that one is
      # ASP.NET Core-hosting-specific and would silently have no effect here).
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderflow};Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-orderflow}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-orderflow}
      RabbitMq__VirtualHost: /
    # No `ports:` — InventoryWorker exposes no HTTP surface at all (pure background service,
    # communicates only through RabbitMQ/Postgres). Nothing outside this compose network ever
    # needs to reach it directly.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static JS bundle at build time — must be the URL the BROWSER (on the
        # host) can reach, i.e. the published host port below, never the internal Docker
        # service name ("ordersapi" only resolves inside the compose network, not from the
        # host machine's browser). InventoryWorker needs no such URL: it has no HTTP surface.
        VITE_ORDERS_API_URL: "http://localhost:${ORDERS_API_PORT:-5081}"
        VITE_POLL_INTERVAL_MS: "${VITE_POLL_INTERVAL_MS:-4000}"
    container_name: orderflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - ordersapi
      - inventoryworker

volumes:
  orderflow_postgres_data:
  orderflow_rabbitmq_data:
