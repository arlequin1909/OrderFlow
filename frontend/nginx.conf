server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page app: serve index.html for any path that isn't a real file, so a future
    # client-side router (none is used today) or a direct refresh on a deep link still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
